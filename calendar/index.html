<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>get a Grip!</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" aria-label="get a Grip!">
      <img src="logo.svg" alt="" width="34" height="34">
      <span class="brand-text">get a <em>Grip!</em></span>
    </a>

    <nav class="tabs" id="tabs" aria-label="보기 전환">
      <button type="button" data-view="monthly">Monthly</button>
      <button type="button" data-view="weekly">Weekly</button>
      <button type="button" data-view="daily">Daily</button>
    </nav>

    <div class="actions">
      <div class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="일정 검색" autocomplete="off">
        <ul id="searchResults" class="search-results" hidden></ul>
      </div>
      <button type="button" class="btn ghost" id="todayBtn">Today</button>
      <button type="button" class="btn primary" id="addBtn">+ Add Event</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <section class="mini">
        <div class="mini-head">
          <span id="miniTitle"></span>
          <span class="mini-nav">
            <button type="button" id="miniPrev" aria-label="이전 달">‹</button>
            <button type="button" id="miniNext" aria-label="다음 달">›</button>
          </span>
        </div>
        <div id="miniGrid"></div>
      </section>

      <section class="upcoming">
        <h2>Upcoming</h2>
        <ul id="upcoming"></ul>
      </section>
    </aside>

    <main class="main">
      <div class="main-head">
        <h1 id="title"></h1>
        <button type="button" class="nav-arrow" id="prevBtn" aria-label="이전">‹</button>
        <button type="button" class="nav-arrow" id="nextBtn" aria-label="다음">›</button>
      </div>
      <div class="panel" id="view"></div>
    </main>
  </div>

  <dialog id="modal">
    <form id="modalForm" method="dialog" novalidate>
      <h2 id="modalTitle">일정 추가</h2>

      <label class="field">
        <span>제목</span>
        <input id="fTitle" type="text" placeholder="예: 심층신경망 수업 듣기" maxlength="60" required>
      </label>

      <label class="field">
        <span>날짜</span>
        <input id="fDate" type="date" required>
      </label>

      <label class="check-row">
        <input id="fTimed" type="checkbox">
        <span>시간 지정 <small>(지정하면 Weekly 시간표에 표시돼요)</small></span>
      </label>

      <div class="field-row">
        <label class="field">
          <span>시작</span>
          <input id="fStart" type="time" step="300">
        </label>
        <label class="field">
          <span>종료</span>
          <input id="fEnd" type="time" step="300">
        </label>
      </div>

      <div class="field">
        <span>색상</span>
        <div class="swatches" id="fColors"></div>
      </div>

      <p class="form-error" id="fError" hidden></p>

      <div class="modal-actions">
        <button type="button" class="btn danger" id="fDelete" hidden>삭제</button>
        <span class="spacer"></span>
        <button type="button" class="btn ghost" id="fCancel">취소</button>
        <button type="submit" class="btn primary">저장</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
