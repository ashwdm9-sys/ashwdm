# Render Blueprint: 뒷공부timer 서버 (화면은 GitHub Pages)
# rootDir 은 한글 경로를 허용하지 않아서 명령어에서 폴더로 이동한다.
services:
  - type: web
    name: dwitgongbu-timer
    runtime: node
    plan: free
    buildCommand: cd 뒷공부timer/server && npm install
    startCommand: cd 뒷공부timer/server && npm start
    healthCheckPath: /api/config
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: ALLOWED_ORIGINS
        value: https://ashwdm9-sys.github.io
      # 토스 키를 넣지 않으면 테스트 키로 동작합니다(실제 출금 없음).
      # 실결제는 Render 대시보드 Environment에서 TOSS_CLIENT_KEY / TOSS_SECRET_KEY 를 live 키로 추가하세요.
